default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: taskflow_development

test:
  <<: *default
  database: taskflow_test

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    database: taskflow_production
  cache:
    <<: *default
    url: <%= ENV["CACHE_DATABASE_URL"] %>
    database: taskflow_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= ENV["QUEUE_DATABASE_URL"] %>
    database: taskflow_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    database: taskflow_production_cable
    migrations_paths: db/cable_migrate
